<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трекер питомца — Питомцы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h2>🐾 Трекер питомца</h2>
        <nav class="menu">
    <a href="index.html">Главная</a>
    <a class="active" href="pets.html">Питомцы</a> <!-- или profile.html -->
    <a href="calendar.html">Календарь</a>
    <a href="#" class="tour-trigger" onclick="startTour(); return false;">💡 Подсказки</a>
    <a href="about.html">О программе</a>
</nav>
        <div class="theme-switcher" data-tour="themeSwitcher">
            <button class="btn btn-light theme-btn" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeLabel">Тёмная тема</span>
            </button>
        </div>
    </aside>
    <main class="content">
        <section class="hero panel" data-tour="hero">
            <div>
                <h1>Питомцы</h1>
                <p>Добавляй, редактируй и удаляй питомцев.</p>
            </div>
            <button class="btn" data-tour="addPetBtn" onclick="openPetModal()">+ Добавить питомца</button>
            <button class="btn" data-tour="exportBtn" onclick="exportData()">Вывести данные</button>
            <button class="btn" data-tour="importBtn" onclick="document.getElementById('importFile').click()">Загрузить данные</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </section>
        <section class="panel">
            <div id="petsGrid" class="pets-grid" data-tour="petsGrid"></div>
        </section>
    </main>
   
</div>
<script src="script.js"></script>
</body>
</html>
