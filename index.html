<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трекер питомца — Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app app-fullheight">
    <aside class="sidebar">
        <h2>🐾 Трекер питомца</h2>
        <nav class="menu">
            <a class="active" href="index.html">Главная</a>
            <a href="pets.html">Питомцы</a>
            <a href="calendar.html">Календарь</a>
            <a href="#" class="tour-trigger" onclick="startTour(); return false;">💡 Подсказки</a>
            <a href="about.html">О программе</a>
        </nav>
        <div class="theme-switcher" data-tour="themeSwitcher">
            <button class="btn btn-light theme-btn" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeLabel">Тёмная тема</span>
            </button>
        </div>
    </aside>
    <main class="content">
        <section class="hero panel" data-tour="hero">
            <div>
                <h1>Главная</h1>
                <p>Ближайшие события и список питомцев.</p>
            </div>
        </section>
        <div class="main-grid">
            <section class="panel" data-tour="petsSection">
                <div class="section-head"><h2>Питомцы</h2></div>
                <div id="petsGrid" class="pets-grid" data-compact="true" data-tour="petsGrid"></div>
            </section>
            <section class="panel" data-tour="upcoming">
                <div class="section-head"><h2>Ближайшие события</h2></div>
                <div id="upcomingEvents" class="stack"></div>
                <a href="calendar.html" class="btn btn-light" style="width:100%; text-align:center; margin-top:12px; display:block;">Все события в календаре →</a>
            </section>
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
